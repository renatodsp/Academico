<head>

</head>
<body>

    <p id="p1"></p>
    <script>
        document.write('Serafino no meio do mato.');

        p1.innerText = 'ipsum';

        let n1 = 2;
        let n2 = 3;
        p1.innerText = n1+n2;

        let nome = 'João';
        let sobrenome = 'Silva';
        document.write(nome + sobrenome );
        document.write('<br>')
        document.write(' n1 + n2 = ' + (n1 + n2));
    
    </script>
